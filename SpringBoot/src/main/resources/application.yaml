spring:
  datasource:
    # Host 5433 -> container bigdata-postgres:5432 (xem init/docker-compose.yml; tránh PG native trên 5432)
    url: jdbc:postgresql://localhost:5433/olist
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8085

# Fake-insert order graph vào Postgres OLTP để demo CDC realtime (FakeOltpInsertScheduler).
# enabled=false để tắt; interval-ms = nhịp giữa các order (ms).
fakeoltp:
  enabled: true
  interval-ms: 8000

logging:
  level:
    root: INFO
    "[org.springframework.kafka]": INFO
