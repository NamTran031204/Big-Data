# Profile: k8s-deploy
# Spring Boot đóng gói thành image và chạy bên trong k8s pod (namespace: bigdata).
# Profile được kích hoạt tự động qua env var SPRING_PROFILES_ACTIVE=k8s-deploy
# trong k8s/70-springboot.yaml Deployment.
#
# Kết nối:
#   PostgreSQL : postgres:5432 (ClusterIP service trong namespace bigdata)
#   Kafka      : kafka:9094    (INTERNAL listener — dùng trong cluster để tránh
#                               advertised EXTERNAL://localhost:9092 bị route sai)

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/olist
    username: postgres
    # Inject từ Secret postgres-secret key POSTGRES_PASSWORD (xem k8s/70-springboot.yaml)
    password: ${POSTGRES_PASSWORD:postgres}

  jpa:
    show-sql: false

  kafka:
    bootstrap-servers: kafka:9094

server:
  port: 8085

fakeoltp:
  enabled: true
  interval-ms: 8000

logging:
  level:
    root: INFO
    "[org.springframework.kafka]": INFO
    "[com.example.BigData]": DEBUG
