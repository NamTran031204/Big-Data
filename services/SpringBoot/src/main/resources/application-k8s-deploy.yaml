
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/olist
    username: postgres
    # Inject từ Secret postgres-secret key POSTGRES_PASSWORD (xem k8s/70-springboot.yaml)
    password: ${POSTGRES_PASSWORD:postgres}

  jpa:
    show-sql: false

  kafka:
    bootstrap-servers: kafka:9094

server:
  port: 8085

fakeoltp:
  enabled: true
  order-interval-ms: 30000

logging:
  level:
    root: INFO
    "[org.springframework.kafka]": INFO
    "[com.example.BigData]": DEBUG
