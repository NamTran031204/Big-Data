# Debezium Connect (custom image có plugin Confluent S3 Sink).
# Build image vào minikube trước: make k8s-build-images
apiVersion: apps/v1
kind: Deployment
metadata:
  name: debezium-connect
  namespace: bigdata
  labels: { app: debezium-connect }
spec:
  replicas: 1
  selector:
    matchLabels: { app: debezium-connect }
  template:
    metadata:
      labels: { app: debezium-connect }
    spec:
      containers:
        - name: debezium-connect
          image: bigdata-debezium:2.4
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8083 }
          env:
            - { name: BOOTSTRAP_SERVERS, value: "kafka:9094" }
            - { name: GROUP_ID, value: "debezium-group" }
            - { name: CONFIG_STORAGE_TOPIC, value: "debezium_connect_configs" }
            - { name: OFFSET_STORAGE_TOPIC, value: "debezium_connect_offsets" }
            - { name: STATUS_STORAGE_TOPIC, value: "debezium_connect_statuses" }
            - { name: CONFIG_STORAGE_REPLICATION_FACTOR, value: "1" }
            - { name: OFFSET_STORAGE_REPLICATION_FACTOR, value: "1" }
            - { name: STATUS_STORAGE_REPLICATION_FACTOR, value: "1" }
          readinessProbe:
            httpGet: { path: /connectors, port: 8083 }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: debezium-connect
  namespace: bigdata
spec:
  selector: { app: debezium-connect }
  ports:
    - { port: 8083, targetPort: 8083 }
  type: ClusterIP
