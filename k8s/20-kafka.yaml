# Zookeeper + Kafka (single broker) cho minikube
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: bigdata
  labels: { app: zookeeper }
spec:
  replicas: 1
  selector:
    matchLabels: { app: zookeeper }
  template:
    metadata:
      labels: { app: zookeeper }
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.0
          ports:
            - { containerPort: 2181 }
          env:
            - { name: ZOOKEEPER_CLIENT_PORT, value: "2181" }
            - { name: ZOOKEEPER_TICK_TIME, value: "2000" }
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: bigdata
spec:
  selector: { app: zookeeper }
  ports:
    - { port: 2181, targetPort: 2181 }
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: bigdata
  labels: { app: kafka }
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-zk
          image: busybox
          command: ['sh', '-c', 'until nc -z zookeeper 2181; do echo wait-zk; sleep 2; done']
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          ports:
            - { containerPort: 9092, name: external }
            - { containerPort: 9094, name: internal }
          env:
            - { name: KAFKA_BROKER_ID, value: "1" }
            - { name: KAFKA_ZOOKEEPER_CONNECT, value: "zookeeper:2181" }
            - { name: KAFKA_LISTENERS, value: "INTERNAL://0.0.0.0:9094,EXTERNAL://0.0.0.0:9092" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka:9094,EXTERNAL://localhost:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "INTERNAL" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
            - { name: KAFKA_LOG_RETENTION_HOURS, value: "168" }
          volumeMounts:
            - { name: kafka-data, mountPath: /var/lib/kafka/data }
  volumeClaimTemplates:
    - metadata: { name: kafka-data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: bigdata
spec:
  selector: { app: kafka }
  ports:
    - { name: external, port: 9092, targetPort: 9092 }
    - { name: internal, port: 9094, targetPort: 9094 }
  type: ClusterIP
