# Spark standalone (master + worker). Code pipeline nạp qua configMap:
#   spark-batch-code  -> /opt/project/spark-batch
#   services-code     -> /opt/project/services/mongodb_connect
# (tạo bằng Makefile: make k8s-code-configmaps)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: bigdata
  labels: { app: spark-master }
spec:
  replicas: 1
  selector:
    matchLabels: { app: spark-master }
  template:
    metadata:
      labels: { app: spark-master }
    spec:
      enableServiceLinks: false
      containers:
        - name: spark-master
          image: bigdata-spark:3.5.1
          imagePullPolicy: IfNotPresent
          command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
          ports:
            - { containerPort: 7077, name: rpc }
            - { containerPort: 8080, name: ui }
          env:
            - { name: PYTHONPATH, value: "/opt/project" }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - { name: spark-batch-code, mountPath: /opt/project/spark-batch }
            - { name: services-code, mountPath: /opt/project/services/mongodb_connect }
      volumes:
        - name: spark-batch-code
          configMap: { name: spark-batch-code, optional: true }
        - name: services-code
          configMap: { name: services-code, optional: true }
---
apiVersion: v1
kind: Service
metadata:
  name: spark-master
  namespace: bigdata
spec:
  selector: { app: spark-master }
  ports:
    - { name: rpc, port: 7077, targetPort: 7077 }
    - { name: ui, port: 8080, targetPort: 8080 }
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  namespace: bigdata
  labels: { app: spark-worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: spark-worker }
  template:
    metadata:
      labels: { app: spark-worker }
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-spark-master
          image: busybox
          command: ['sh', '-c', 'until wget -qO- http://spark-master:8080 > /dev/null 2>&1; do echo wait-spark-master; sleep 3; done']
      containers:
        - name: spark-worker
          image: bigdata-spark:3.5.1
          imagePullPolicy: IfNotPresent
          command:
            - "/opt/spark/bin/spark-class"
            - "org.apache.spark.deploy.worker.Worker"
            - "spark://spark-master:7077"
            - "--cores"
            - "2"
            - "--memory"
            - "2g"
          env:
            - { name: PYTHONPATH, value: "/opt/project" }
          volumeMounts:
            - { name: spark-batch-code, mountPath: /opt/project/spark-batch }
            - { name: services-code, mountPath: /opt/project/services/mongodb_connect }
          resources:
            requests: { memory: "1Gi", cpu: "500m" }
            limits: { memory: "3Gi", cpu: "2" }
      volumes:
        - name: spark-batch-code
          configMap: { name: spark-batch-code, optional: true }
        - name: services-code
          configMap: { name: services-code, optional: true }
