apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: bigdata
  labels: { app: mongodb }
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels: { app: mongodb }
  template:
    metadata:
      labels: { app: mongodb }
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - { containerPort: 27017 }
          envFrom:
            - secretRef: { name: mongo-secret }
          volumeMounts:
            - { name: mongo-data, mountPath: /data/db }
          resources:
            requests: { memory: "256Mi", cpu: "250m" }
            limits: { memory: "1Gi", cpu: "1" }
  volumeClaimTemplates:
    - metadata: { name: mongo-data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 3Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: bigdata
spec:
  selector: { app: mongodb }
  ports:
    - { port: 27017, targetPort: 27017 }
  type: ClusterIP
