apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: bigdata
  labels: { app: minio }
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-06-13T11-33-47Z
          command: ["minio", "server", "/data", "--console-address", ":9001"]
          ports:
            - { containerPort: 9000, name: api }
            - { containerPort: 9001, name: console }
          envFrom:
            - secretRef: { name: minio-secret }
          env:
            - { name: MINIO_PROMETHEUS_AUTH_TYPE, value: "public" }
          livenessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - { name: minio-data, mountPath: /data }
          resources:
            requests: { memory: "512Mi", cpu: "250m" }
            limits: { memory: "2Gi", cpu: "1" }
  volumeClaimTemplates:
    - metadata: { name: minio-data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: bigdata
spec:
  selector: { app: minio }
  ports:
    - { name: api, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
  type: ClusterIP
---
# Job tạo bucket (bronze/silver/gold/checkpoint)
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-buckets
  namespace: bigdata
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          envFrom:
            - secretRef: { name: minio-secret }
          command: ["/bin/sh", "-c"]
          args:
            - |
              until mc alias set m http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
                echo "waiting minio..."; sleep 3;
              done
              for b in bronze-zone silver-zone gold-zone checkpoint; do
                mc mb --ignore-existing m/$b;
              done
              echo "buckets ready"
